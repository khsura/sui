name: Test & Build

on:
  pull_request:
    branches:
      - main
      - "feature/**"
env:
  HUSKY: 0

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "20"

      - name: Enable Corepack
        run: corepack enable

      - name: Set yarn version
        run: yarn set version self

      - name: Install dependencies
        run: yarn install

      - name: Run build
        run: yarn build

      # The app build regenerates the sui-plugin skill API tables from dist/sui-api.json.
      - name: Check skill API tables are up to date
        run: |
          yarn workspace @khsura/sui check:skills
          git diff --exit-code -- plugins/sui-plugin/skills || {
            echo "::error::sui-plugin skill API tables are stale. Run 'yarn build:api && yarn sync:skills' in packages/app and commit the result."
            exit 1
          }

      # Installs the packed tarball into a minimal Vite app outside the workspace, without and with vue-router.
      - name: Consumer smoke test
        run: yarn workspace @khsura/sui test:consumer

      - name: Run storybook build
        run: yarn storybook:build
