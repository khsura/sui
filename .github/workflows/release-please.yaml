name: release-please

on:
  push:
    branches:
      - main

# Nothing by default; each job asks only for what it needs.
permissions: {}

env:
  HUSKY: 0

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Debug release output
        run: |
          echo "Release Created: $RELEASE_CREATED"
        env:
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing (OIDC): no npm token, provenance attached automatically
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24" # ships npm >= 11.5.1, required for Trusted Publishing
          registry-url: "https://registry.npmjs.org"

      - name: Enable Corepack
        run: corepack enable

      # --mode=skip-build: dependency lifecycle scripts never run in the job that holds the OIDC token.
      # The builds below need none of them (esbuild/rollup ship prebuilt platform binaries).
      - name: Install dependencies
        run: yarn install --immutable --mode=skip-build

      # Builds and publishes every package with a `release` target (@khsura/sui, then @khsura/sui-mcp,
      # which bundles the app's dist/sui-api.json) to public npm. Versions already on npm are skipped.
      # Auth: npm Trusted Publishing for khsura/sui + release-please.yaml (configured on npmjs.com), no secret.
      - name: Run publish
        run: yarn release
